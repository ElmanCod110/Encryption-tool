name: Bug report
description: Report a reproducible defect in Secure Package
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, patterns, recovery keys, plaintext files, private signing keys, or other secrets. For sensitive security issues, follow SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps using non-sensitive test data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
      description: Value from the root VERSION file or app display.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, PHP version, browser, and extension availability.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
      description: Include only non-sensitive error messages.
    validations:
      required: false
