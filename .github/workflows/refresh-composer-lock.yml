name: Refresh Composer Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Resolve and write a real lockfile
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Validate manifest and generated lockfile
        run: composer validate --strict --no-check-publish

      - name: Audit resolved dependencies
        id: audit
        continue-on-error: true
        run: composer audit --no-interaction

      - name: Fail the workflow when dependency audit fails
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::composer audit failed. Review and resolve or document dependency findings before merging."
          exit 1

      - name: Open a pull request with the generated lockfile
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/generated-composer-lock
          delete-branch: false
          add-paths: composer.lock
          commit-message: "build: add Composer dependency lockfile"
          title: "build: add real Composer lockfile"
          body: |
            ## Summary
            - Generate `composer.lock` using Composer in a clean GitHub Actions runner.
            - Validate the manifest and lockfile with `composer validate --strict --no-check-publish`.
            - Run `composer audit --no-interaction`; this workflow fails before opening a PR if the audit step fails (including an audit command marked continue-on-error for outcome reporting).

            ## Review checklist
            - [ ] Confirm the lockfile was generated by Composer (not hand-written).
            - [ ] Review resolved package versions and licenses.
            - [ ] Review all dependency advisories, if any, and resolve or explicitly document them.
            - [ ] Confirm CI and release checks pass with locked dependencies.

            This PR is intentionally not auto-merged. The lockfile and audit findings require human review.
