name: Client Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          find public/client -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Legacy browser V13 round-trip
        run: node tests/BrowserV13RoundTripTest.mjs
