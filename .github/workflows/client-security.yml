name: Client Security

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          find public/client -type f -name '*.js' -print0 | xargs -0 -n1 node --check
