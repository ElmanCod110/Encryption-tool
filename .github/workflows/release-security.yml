name: V14 Release Security Gate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          extensions: sodium,zip,pdo_mysql
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Require committed dependency lockfile
        run: |
          if [ ! -f composer.lock ]; then
            echo "::error::composer.lock is required for a reproducible release. Generate it with Composer in a supported development environment and commit it."
            exit 1
          fi
          composer validate --strict --no-check-publish

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Dependency audit
        run: composer audit --no-interaction

      - name: PHP syntax
        run: find app bin public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: find public/client -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Self check
        run: php bin/self-check.php

      - name: Security suite
        run: php bin/security-test.php --full

      - name: Source audit
        run: php bin/source-audit.php
