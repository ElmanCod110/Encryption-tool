name: V14 Release Security Gate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          extensions: sodium,zip,pdo_mysql
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Strict lock validation when a lock is committed
        run: |
          if [ -f composer.lock ]; then
            composer validate --strict --no-check-publish
          else
            echo "::notice::composer.lock is not committed; release verification will resolve composer.json."
          fi

      - name: Install dependencies
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --no-progress --prefer-dist
          else
            composer install --no-interaction --no-progress --prefer-dist
          fi

      - name: Dependency audit
        run: composer audit --no-interaction

      - name: PHP syntax
        run: find app bin public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: find public/client -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Self check
        run: php bin/self-check.php

      - name: Security suite
        run: php bin/security-test.php --full

      - name: Source audit
        run: php bin/source-audit.php
