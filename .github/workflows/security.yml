name: Security and Release Integrity

on:
  push:
  pull_request:

jobs:
  php-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, zip, pdo_mysql
      - name: PHP syntax check
        run: |
          find app bin public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Composer validation
        run: composer validate --strict --no-check-publish
      - name: Dependency audit
        run: composer audit --no-interaction
      - name: Core tests
        run: |
          php tests/CryptoRoundTripTest.php
          php tests/FileRoundTripTest.php
          php tests/KdfParameterTest.php
          php tests/PackageRoundTripTest.php
          php tests/TamperDetectionTest.php
          php tests/ResumableUploadTest.php
          php tests/SecurityInvariantTest.php
          php tests/SignedStateTest.php
          php tests/ReleaseIntegrityTest.php
          php tests/V13DescriptorTest.php
          php tests/V13UploadTest.php
      - name: Self check
        run: php bin/self-check.php
