name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium,zip,pdo_mysql
          coverage: none
      - name: Syntax check
        run: find app bin public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find public/client -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Browser V13 round-trip tests
        run: node tests/BrowserV13RoundTripTest.mjs
      - name: Self check
        run: php bin/self-check.php
      - name: Core tests
        shell: bash
        run: |
          set -e
          for test in tests/*.php; do php "$test"; done


  windows-file-icon:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium,zip,pdo_mysql
          coverage: none
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem platform/windows/file-association -Filter *.ps1 -File
          if ($files.Count -lt 3) { throw "Expected register, unregister, and refresh PowerShell scripts." }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref] $tokens, [ref] $errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.Name): $($_.Message)" }
              exit 1
            }
          }
      - name: Exercise embedded SPK13 icon extraction on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iconBytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD 'logo/files.ico'))
          $presentation = @{
            icon_format = 'image/x-icon'
            icon_data = [Convert]::ToBase64String($iconBytes)
          }
          $header = @{
            format = 'SECURE-BROWSER-V13'
            version = 13
            presentation = $presentation
          }
          $headerBytes = [System.Text.Encoding]::UTF8.GetBytes(($header | ConvertTo-Json -Compress -Depth 4))
          $lengthBytes = [BitConverter]::GetBytes([uint32]$headerBytes.Length)
          [Array]::Reverse($lengthBytes)
          $magic = [byte[]]([System.Text.Encoding]::ASCII.GetBytes('SPK13BIN1') + [byte[]]@(10))
          $packageBytes = [byte[]]($magic + $lengthBytes + $headerBytes)
          $packagePath = Join-Path $env:TEMP ('spk13-icon-test-' + [Guid]::NewGuid().ToString('N') + '.spk13')
          $cachePath = Join-Path $env:LOCALAPPDATA 'EncryptionTool/SPK13/files.ico'
          $registryPath = 'HKCU:\Software\Classes\SystemFileAssociations\.spk13\DefaultIcon'
          try {
            [System.IO.File]::WriteAllBytes($packagePath, $packageBytes)
            & .\platform\windows\file-association\install-from-package.ps1 -PackagePath $packagePath
            if (-not (Test-Path -LiteralPath $cachePath -PathType Leaf)) { throw 'Installer did not write the extracted icon.' }
            $expectedHash = (Get-FileHash -LiteralPath (Join-Path $PWD 'logo/files.ico') -Algorithm SHA256).Hash
            $actualHash = (Get-FileHash -LiteralPath $cachePath -Algorithm SHA256).Hash
            if ($actualHash -ne $expectedHash) { throw 'Extracted icon bytes do not match the reviewed project icon.' }
            $key = Get-Item -LiteralPath $registryPath
            if (-not ([string]$key.GetValue('')).EndsWith('files.ico",0')) { throw 'Explorer DefaultIcon registration is incorrect.' }
          } finally {
            if (Test-Path -LiteralPath 'HKCU:\Software\EncryptionTool\FileAssociations\SPK13') {
              & .\platform\windows\file-association\unregister.ps1
            }
            if (Test-Path -LiteralPath $packagePath) { Remove-Item -LiteralPath $packagePath -Force }
            if (Test-Path -LiteralPath $cachePath) { Remove-Item -LiteralPath $cachePath -Force }
          }
      - name: Validate SPK13 icon integration safeguards
        run: php tests/WindowsSpk13IconIntegrationTest.php
